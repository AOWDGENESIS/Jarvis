name: JARVIS local dictation checks

on:
  pull_request:
    branches: [main]
    paths:
      - "jarvis_omega_v7/**"
  push:
    branches: ["feat/local-whisper-dictation-deep-review"]
    paths:
      - "jarvis_omega_v7/**"

jobs:
  python-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis_omega_v7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check "fastapi>=0.115.0" "python-multipart>=0.0.20"
      - name: Compile Python modules
        run: python -m compileall -q core main.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
