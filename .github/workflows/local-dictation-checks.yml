name: JARVIS local dictation checks

on:
  pull_request:
    branches: [main]
    paths:
      - "jarvis_omega_v7/**"
  push:
    branches: ["feat/local-whisper-dictation-deep-review"]
    paths:
      - "jarvis_omega_v7/**"

jobs:
  python-checks:
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    defaults:
      run:
        working-directory: jarvis_omega_v7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check "fastapi>=0.115.0" "python-multipart>=0.0.20" "httpx2" "ruff"
      - name: Compile Python modules
        run: python -m compileall -q core main.py tests
      - name: Lint changed Python modules
        run: python -m ruff check core/dictation.py tests/test_dictation.py
      - name: Check local dictation JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("frontend/index.html").read_text(encoding="utf-8")
          start = source.index("/* LOCAL WHISPER DICTATION")
          end = source.index("/* ═════════", start)
          Path("/tmp/local-dictation.js").write_text(source[start:end], encoding="utf-8")
          PY
          node --check /tmp/local-dictation.js
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
