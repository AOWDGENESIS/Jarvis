<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#020d1f"/>
      <stop offset="100%" stop-color="#000509"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="30%"  stop-color="#00d4ff"/>
      <stop offset="70%"  stop-color="#0064b4"/>
      <stop offset="100%" stop-color="#001428"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00d4ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="128" cy="128" r="128" fill="url(#bg)"/>

  <!-- Glow halo -->
  <circle cx="128" cy="128" r="110" fill="url(#glow)" filter="url(#blur)" opacity="0.8"/>

  <!-- Ring 3 — Orange -->
  <circle cx="128" cy="128" r="108" fill="none" stroke="#ff9d00" stroke-width="2.5" stroke-opacity="0.7"
          stroke-dasharray="12 8"/>

  <!-- Ring 2 — Magenta -->
  <circle cx="128" cy="128" r="90" fill="none" stroke="#ff007f" stroke-width="2" stroke-opacity="0.8"
          stroke-dasharray="6 4"/>

  <!-- Ring 1 — Cyan -->
  <circle cx="128" cy="128" r="72" fill="none" stroke="#00d4ff" stroke-width="3" stroke-opacity="0.9"/>

  <!-- Inner ring -->
  <circle cx="128" cy="128" r="55" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.5"
          stroke-dasharray="4 4"/>

  <!-- Core glow -->
  <circle cx="128" cy="128" r="45" fill="#00d4ff" opacity="0.15"/>

  <!-- Core -->
  <circle cx="128" cy="128" r="38" fill="url(#core)"/>
  <circle cx="128" cy="128" r="38" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- J letter -->
  <text x="128" y="141" font-family="Arial Black, sans-serif" font-size="38" font-weight="900"
        fill="#000d1a" text-anchor="middle" letter-spacing="-1">J</text>

  <!-- Orbital dots -->
  <circle cx="128" cy="20"  r="5" fill="#00d4ff" opacity="0.9"/>
  <circle cx="236" cy="128" r="4" fill="#ff007f" opacity="0.8"/>
  <circle cx="20"  cy="128" r="4" fill="#ff9d00" opacity="0.7"/>
  <circle cx="128" cy="236" r="3" fill="#00d4ff" opacity="0.6"/>

  <!-- Tick marks auf Ring 1 -->
  <line x1="128" y1="57" x2="128" y2="50" stroke="#00d4ff" stroke-width="2" opacity="0.8"/>
  <line x1="200" y1="128" x2="207" y2="128" stroke="#00d4ff" stroke-width="2" opacity="0.8"/>
  <line x1="128" y1="199" x2="128" y2="206" stroke="#00d4ff" stroke-width="2" opacity="0.8"/>
  <line x1="56"  y1="128" x2="49"  y2="128" stroke="#00d4ff" stroke-width="2" opacity="0.8"/>
</svg>
